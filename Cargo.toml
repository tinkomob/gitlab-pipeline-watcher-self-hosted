[package]
name = "pipeline-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links", "wayland", "x11"] }
futures-util = "0.3"
keyring = "4.2"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.24", features = ["Data_Xml_Dom", "Win32_System_Com", "UI_Notifications", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winrt-notification = "0.5.1"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"
